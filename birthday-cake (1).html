<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Праздничный торт</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fff5e6;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      font-family: 'Comic Sans MS', cursive;
    }

    .cake-container {
      position: relative;
      width: 260px;
      animation: fadeIn 2s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(50px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .layer {
      position: relative;
      margin: 0 auto;
      border-radius: 10px;
      margin-top: -10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .layer-1 {
      width: 240px;
      height: 50px;
      background: #94634b;
    }

    .layer-2 {
      width: 200px;
      height: 45px;
      background: #ab7d4a92;
    }

    .layer-3 {
      width: 160px;
      height: 40px;
       background: #ab7d4a92;
    }

    .layer-4 {
      width: 120px;
      height: 35px;
       background: #ab7d4a92;
    }

    .icing {
      position: absolute;
      width: 100%;
      height: 12px;
      top: 0;
      background: white;
      border-radius: 10px 10px 0 0;
      z-index: 2;
    }

    .cherry {
      position: absolute;
      width: 10px;
      height: 10px;
      background: red;
      border-radius: 50%;
      top: 2px;
    }

    .cherry.left { left: 10px; }
    .cherry.center { left: 50%; transform: translateX(-50%); }
    .cherry.right { right: 10px; }

    .candle {
      position: absolute;
      width: 4px;
      height: 30px;
      background: #6c3483;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 2px;
    }

    .flame {
      position: absolute;
      top: -14px;
      left: 50%;
      width: 10px;
      height: 14px;
      background: radial-gradient(ellipse at center, #ffa500 40%, #5a3629 100%);
      border-radius: 50% 50% 50% 50%;
      transform: translateX(-50%) rotate(-10deg);
      animation: flicker 0.3s infinite alternate;
      opacity: 0.9;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-5deg); opacity: 0.8; }
      100% { transform: translateX(-50%) scale(1.2) rotate(5deg); opacity: 1; }
    }

    .message {
      margin-top: 30px;
      font-size: 24px;
      color: #444;
      text-align: center;
    }

    /* Конфетти */
    .confetti {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 2px;
      opacity: 0.9;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(100vh) rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="cake-container">
    <!-- Верхний слой -->
    <div class="layer layer-4">
      <div class="icing"></div>
      <div class="cherry center"></div>
      <div class="candle">
        <div class="flame"></div>
      </div>
    </div>

    <!-- 3-й слой -->
    <div class="layer layer-3">
      <div class="icing"></div>
      <div class="cherry left"></div>
      <div class="cherry right"></div>
    </div>

    <!-- 2-й слой -->
    <div class="layer layer-2">
      <div class="icing"></div>
      <div class="cherry left"></div>
      <div class="cherry center"></div>
      <div class="cherry right"></div>
    </div>

    <!-- Нижний слой -->
    <div class="layer layer-1">
      <div class="icing"></div>
      <div class="cherry left"></div>
      <div class="cherry center"></div>
      <div class="cherry right"></div>
    </div>
  </div>

  <div class="message">посмотри на красиви тортик!</div>

  <script>
    // 🎉 Конфетти генератор
    function createConfetti() {
      const colors = ['#ff3b3f', '#fcd34d', '#6ee7b7', '#93c5fd', '#c084fc', '#f472b6'];
      for (let i = 0; i < 80; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.top = -Math.random() * 20 + 'vh';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDuration = (3 + Math.random() * 3) + 's';
        confetti.style.animationDelay = Math.random() * 5 + 's';
        document.body.appendChild(confetti);
      }
    }

    createConfetti();

    // ⏳ Таймер на редирект
    setTimeout(() => {
      window.location.href = "https://example.com"; // Замените на нужный сайт
    }, 10000); // 10 секунд
  </script>

</body>
</html>
